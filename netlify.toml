[build]
  publish = "."

# CSS e JS sem hash no nome: NUNCA immutable
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Os globs da raiz (/*.css) não casam subpath. A V2 precisa dos seus próprios.
[[headers]]
  for = "/v2/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/v2/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/obrigado/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/obrigado/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# A legenda é texto e vai precisar de ajuste fino uma hora. Sem hash no nome,
# immutable prenderia a versão errada por um ano — mesma regra do CSS/JS.
# Precisa vir DEPOIS do /video/* para sobrescrever.
[[headers]]
  for = "/video/*.vtt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
