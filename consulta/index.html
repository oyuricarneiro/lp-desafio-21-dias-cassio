<style>

  html,body{height:100%}
  body{

      radial-gradient(120% 90% at 50% 30%, #1E1C1A 0%, rgba(18,18,18,0) 58%),

  .ponte{max-width:440px;text-align:center}

  .ponte__pontos span:nth-child(2){animation-delay:.16s}

  @keyframes pulso{0%,100%{opacity:.28;transform:scale(.82)}50%{opacity:1;transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.ponte__pontos span{animation:none;opacity:.7}}
  .ponte__btn{

    padding:15px 28px;
    border-radius:5px;

    font-size:14px;
    font-weight:700;
    letter-spacing:.04em;

<script>
(function () {
  var destino = document.getElementById('ir').href;

  /* O push acontece ANTES do redirect. O dataLayer é uma fila: mesmo que o
     gtm.js ainda não tenha carregado, o evento fica guardado. O que a gente
     não controla é a navegação chegar primeiro — daí a folga abaixo. */
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    event: 'consulta_whatsapp',
    origem: document.referrer || 'direto',
    query: window.location.search.slice(1)
  });

  /* Folga curta para o GTM subir sem que a espera seja percebida.
     replace() e não href: a ponte não fica no histórico, então o botão
     "voltar" do celular leva de volta ao e-mail, não a esta página. */
  setTimeout(function () { window.location.replace(destino); }, 600);
})();
</script>
